[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-engineering"
version = "0.6.0"
description = "Powerful terminal platform for governed agent work: graph tasks, MCP tools, personas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.30.0",
  "rich==14.3.4",
  "pydantic==2.12.5",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "cryptography==50.0.1",
  "pypdf==6.21.4",
  "prompt-toolkit==3.0.52",
]

[project.scripts]
pi-engineering = "pi_app:main"

[tool.setuptools]
py-modules = ["pi_app", "pi_workspace", "pi_engine", "pi_tools", "pi_terminal", "pi_workflow", "pi_server", "pi_models", "pi_knowledge", "pi_operations", "pi_qualification", "pi_live", "pi_prompt", "pi_profile", "pi_system"]


[tool.setuptools.data-files]
"share/pi-engineering/presets" = ["presets/*.json"]
"share/pi-engineering/workflows" = ["workflows/*.json"]
"share/pi-engineering/examples/systems" = ["examples/systems/*.json"]
