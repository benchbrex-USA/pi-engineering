name: CLI qualification
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements.lock . build
      - run: python -m unittest discover -s tests -v
      - run: python -m build --wheel
      - run: python tests/check_distribution.py "$(command -v pi-engineering)"
      - run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - run: python -m pip_audit . --progress-spinner off
      - run: python -m bandit pi_app.py pi_workspace.py pi_engine.py pi_tools.py pi_models.py pi_operations.py pi_knowledge.py pi_workflow.py pi_server.py pi_terminal.py pi_qualification.py
